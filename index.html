<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebQ88</title>
  </head>
  <body>
    <div id="app">
      <h1>WebQ88</h1>
      <div id="status">起動準備中…</div>
      <canvas id="screen" width="640" height="400" tabindex="0"></canvas>
      <div id="rom-loader">
        <label for="rom-files">利用者ROMを読み込む(複数選択可・任意。渡すと制限モードになります):</label>
        <input type="file" id="rom-files" multiple />
        <button id="rom-boot" type="button">起動 / 再起動</button>
      </div>
      <div id="mode-info"></div>
    </div>
    <!--
      src/keyboard.ts の記号キー変換は public/api-dispatch.js(type_text)と
      同じ表(public/char-map.js)を使う(表を二重に持たない)。Vite変換前の
      素のクラシックスクリプトとして読み込み、window.WebQ88CharMap に生やす。
    -->
    <script src="/char-map.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
